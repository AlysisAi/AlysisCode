schema_version = 1

[plugin]
id = "alysis.miro"
name = "Miro"
version = "1.0.0"
description = "Search and read Miro boards, create diagrams and tables, and edit board content with your approval."
author = "Alysis AI (integration); Miro (MCP server)"
license = "MIT"
homepage = "https://developers.miro.com/docs/miro-mcp-tools"
keywords = ["miro", "mcp", "work"]

[compatibility]
alysis = ">=0.14.2"

# Reviewed against the official Miro MCP tool reference on 2026-11-04. canvas_update_from_svg can create, update AND delete items and always requires approval. Sharing, team moves, upload slot allocation and removed legacy tools are excluded.
[[components.verified_connector]]
id = "miro"
url = "https://mcp.miro.com/"
resource = "https://mcp.miro.com/"
oauth_issuer = "https://mcp.miro.com/"
oauth_sign_in_origins = []
oauth_scopes = ["boards:read", "boards:write"]
max_argument_bytes = 32768
host_arguments = []
oauth_client = "dynamic"

[[components.verified_connector.tools]]
name = "canvas_read_as_svg"
reads_only = true

