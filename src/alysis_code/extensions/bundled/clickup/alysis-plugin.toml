schema_version = 1

[plugin]
id = "alysis.clickup"
name = "ClickUp"
version = "1.0.0"
description = "ClickUp's official remote MCP tools: read and search tasks, docs and chat. Every change asks you first; chat messages and comments post as you."
author = "Alysis AI (integration); ClickUp (MCP server)"
license = "MIT"
homepage = "https://developer.clickup.com/docs/connect-an-ai-assistant-to-clickups-mcp-server"
keywords = ["clickup", "mcp", "tasks", "projects", "docs"]

[compatibility]
alysis = ">=0.14.1"

# ClickUp's official remote MCP server (all plans; the Free plan allows 100 calls a day). ClickUp
# issues no refresh token, so the person signs in again when its sign-in ends. Chat messages and
# comments post as the person and notify others; update_document_page can replace a whole page;
# delete_task moves a task to Trash. Each change asks a person first. Left out: merge_tasks and
# delete_comment (can't be undone), execute_operator with its get_operators/get_schema (a gate to
# operations the server can change), and file uploads.
[[components.verified_connector]]
id = "clickup"
url = "https://mcp.clickup.com/mcp"
resource = "https://mcp.clickup.com/mcp"
oauth_issuer = "https://mcp.clickup.com"
oauth_sign_in_origins = []
oauth_client = "dynamic"
oauth_scopes = ["read", "write"]
max_argument_bytes = 32768
host_arguments = []

[[components.verified_connector.tools]]
name = "clickup_get_task"
reads_only = true

