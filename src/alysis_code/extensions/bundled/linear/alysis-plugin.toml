schema_version = 1

[plugin]
id = "alysis.linear"
name = "Linear"
version = "1.0.0"
description = "Linear's official remote MCP tools: find and read issues, projects and documents; every change asks you first."
author = "Alysis AI (integration); Linear (MCP server)"
license = "MIT"
homepage = "https://linear.app/docs/mcp"
keywords = ["linear", "mcp", "issues", "projects", "tasks"]

[compatibility]
alysis = ">=0.14.1"

# Linear's official remote MCP server. The app keeps the sign-in; only the reviewed tools
# below are offered, and every tool not marked reads_only asks a person before each call.
[[components.verified_connector]]
id = "linear"
url = "https://mcp.linear.app/mcp"
resource = "https://mcp.linear.app/mcp"
oauth_issuer = "https://mcp.linear.app"
oauth_sign_in_origins = []
oauth_client = "dynamic"
oauth_scopes = ["read", "write"]
max_argument_bytes = 32768
host_arguments = []

[[components.verified_connector.tools]]
name = "list_issues"
reads_only = true

[[components.verified_connector.tools]]
name = "get_issue"
reads_only = true

[[components.verified_connector.tools]]
name = "list_issue_statuses"
reads_only = true

