schema_version = 1

[plugin]
id = "alysis.atlassian"
name = "Jira + Confluence"
version = "1.0.0"
description = "Atlassian's official remote MCP tools for one Jira and Confluence site you pick: search and read issues and pages; every change asks you first."
author = "Alysis AI (integration); Atlassian (Rovo MCP server)"
license = "MIT"
homepage = "https://support.atlassian.com/atlassian-rovo-mcp-server/"
keywords = ["jira", "confluence", "atlassian", "mcp", "issues", "wiki"]

[compatibility]
alysis = ">=0.14.1"

# Atlassian's official remote MCP server (Rovo MCP, flat tool list). The app keeps the sign-in;
# only the reviewed tools below are offered, and every tool not marked reads_only asks a person
# before each call.
[[components.verified_connector]]
id = "atlassian"
url = "https://mcp.atlassian.com/v2/mcp?tools=all"
resource = "https://mcp.atlassian.com/v2/mcp"
oauth_issuer = "https://auth.atlassian.com/VCeDsk8ZHncYF1g234fKtc4lNipbBhu3"
oauth_sign_in_origins = ["https://auth.atlassian.com"]
oauth_client = "dynamic"
oauth_scopes = ["read:me", "offline_access", "read:jira:agent-interface", "write:jira:agent-interface", "search:jira:agent-interface", "read:confluence:agent-interface", "write:confluence:agent-interface", "search:confluence:agent-interface"]
max_argument_bytes = 32768

# Filled in by the app after approval with the site the person picked; the AI never sets it.
[[components.verified_connector.host_arguments]]
name = "cloudId"
source = "atlassian_site"

[[components.verified_connector.tools]]
