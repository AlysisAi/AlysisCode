schema_version = 1

[plugin]
id = "alysis.notion"
name = "Notion"
version = "1.0.0"
description = "Notion's official remote MCP tools: search and read your pages and databases; every change asks you first."
author = "Alysis AI (integration); Notion (MCP server)"
license = "MIT"
homepage = "https://developers.notion.com/guides/mcp/get-started-with-mcp"
keywords = ["notion", "mcp", "notes", "wiki", "docs"]

[compatibility]
alysis = ">=0.14.1"

# Notion's official remote MCP server. The app keeps the sign-in; only the reviewed tools
# below are offered, and every tool not marked reads_only asks a person before each call.
[[components.verified_connector]]
id = "notion"
url = "https://mcp.notion.com/mcp"
resource = "https://mcp.notion.com/mcp"
oauth_issuer = "https://mcp.notion.com"
oauth_sign_in_origins = []
oauth_client = "dynamic"
oauth_scopes = ["default"]
max_argument_bytes = 32768
host_arguments = []

[[components.verified_connector.tools]]
name = "notion-search"
reads_only = true

[[components.verified_connector.tools]]
name = "notion-fetch"
reads_only = true

[[components.verified_connector.tools]]
name = "notion-get-self"
reads_only = true

[[components.verified_connector.tools]]
