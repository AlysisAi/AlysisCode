schema_version = 1

[plugin]
id = "alysis.todoist"
name = "Todoist"
version = "1.0.0"
description = "Todoist's official remote MCP tools: find and read your tasks and projects. Every change asks you first; deleting and public template links are left out."
author = "Alysis AI (integration); Todoist (MCP server)"
license = "MIT"
homepage = "https://github.com/Doist/todoist-mcp"
keywords = ["todoist", "mcp", "tasks", "todo", "projects"]

[compatibility]
alysis = ">=0.14.1"

# Todoist's official remote MCP server (Doist). The sign-in server is todoist.com, the one extra
# sign-in site. Scope data:read_write (not data:delete or project:delete). Comments and assignments
# notify other people; project-move can change a project's workspace and visibility; each change asks a
# person first. Left out: delete-object (permanent), export-project-template (a public link anyone can
# open), import-project-template (reads an outside file), analyze-project-health (an AI analysis), and
# the search/fetch pair that repeats find-* and fetch-object.
[[components.verified_connector]]
id = "todoist"
url = "https://ai.todoist.net/mcp"
resource = "https://ai.todoist.net/mcp"
oauth_issuer = "https://todoist.com"
oauth_sign_in_origins = ["https://todoist.com"]
oauth_client = "dynamic"
oauth_scopes = ["data:read_write"]
max_argument_bytes = 32768
host_arguments = []

[[components.verified_connector.tools]]
name = "find-tasks"
reads_only = true

[[components.verified_connector.tools]]
name = "find-tasks-by-date"
reads_only = true

