name: vscode-real-remote-acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable vX.Y.Z tag used by the managed candidate run.
        required: true
        type: string
      candidate_run_id:
        description: Successful managed-cli-vsix-release run containing linux-x64.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-real-remote-acceptance-${{ inputs.release_tag }}-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate source, candidate, and remote environment policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release and candidate identity
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_REPOSITORY: AlysisAi/AlysisCode
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REPOSITORY_PRIVATE" = "false"
          test "$REPOSITORY_VISIBILITY" = "public"
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > candidate-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$GITHUB_SHA" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .run_attempt == 1 and .path == ".github/workflows/managed-cli-vsix-release.yml" and .head_sha == $source_sha and .head_branch == $release_tag and .repository.full_name == $repository and .head_repository.full_name == $repository' \
            candidate-run.json > /dev/null
      - name: Require protected exact-tag remote environments
        shell: bash
        env:
          GH_API_VERSION: "2026-03-10"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for environment in vscode-real-wsl-acceptance vscode-real-remote-ssh-acceptance
          do
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $GH_API_VERSION" \
              "/repos/${GITHUB_REPOSITORY}/environments/${environment}" \
              > "${environment}.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: $GH_API_VERSION" \
              "/repos/${GITHUB_REPOSITORY}/environments/${environment}/deployment-branch-policies?per_page=100" \
              > "${environment}-branch-policies.json"
            python scripts/release/validate_github_environment_policy.py \
              "${environment}.json" "${environment}-branch-policies.json" \
              --environment "$environment" \
              --required-pattern 'v*'
          done

  remote-acceptance:
    name: Real ${{ matrix.environment }} installed-VSIX acceptance
    needs: validate-release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: wsl
            protected_environment: vscode-real-wsl-acceptance
            runner_label: real-wsl
            runner_role: real-wsl
            remote_extension_version: 0.88.2
          - environment: remote_ssh
            protected_environment: vscode-real-remote-ssh-acceptance
            runner_label: real-remote-ssh
            runner_role: real-remote-ssh
            remote_extension_version: 0.112.0
    runs-on:
      - self-hosted
      - windows
      - x64
      - alysis-release
      - ${{ matrix.runner_label }}
    environment: ${{ matrix.protected_environment }}
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      EXPECTED_VSCODE_VERSION: 1.90.0
      REMOTE_AUTHORITY: ${{ vars.ALYSIS_REMOTE_AUTHORITY }}
      REMOTE_CONNECTION: ${{ vars.ALYSIS_REMOTE_CONNECTION }}
      REMOTE_EXTENSION_SHA256: ${{ vars.ALYSIS_REMOTE_EXTENSION_SHA256 }}
      REMOTE_EXTENSION_VSIX: ${{ vars.ALYSIS_REMOTE_EXTENSION_VSIX }}
      REMOTE_WORKSPACE_ROOT: ${{ vars.ALYSIS_REMOTE_WORKSPACE_ROOT }}
      RUNNER_ROLE: ${{ vars.ALYSIS_ACCEPTANCE_RUNNER_ROLE }}
      VSCODE_EXECUTABLE: ${{ vars.ALYSIS_VSCODE_EXECUTABLE }}
      VSCODE_EXECUTABLE_SHA256: ${{ vars.ALYSIS_VSCODE_EXECUTABLE_SHA256 }}
    steps:
      - name: Check out exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python before policy and provenance validation
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Revalidate remote acceptance policy after approval
        shell: pwsh
        env:
          GH_API_VERSION: "2026-03-10"
          GH_TOKEN: ${{ github.token }}
          PROTECTED_ENVIRONMENT: ${{ matrix.protected_environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: $env:GH_API_VERSION" `
            "/repos/$env:GITHUB_REPOSITORY/environments/$env:PROTECTED_ENVIRONMENT" |
            Out-File -Encoding utf8 "$env:PROTECTED_ENVIRONMENT.json"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: $env:GH_API_VERSION" `
            "/repos/$env:GITHUB_REPOSITORY/environments/$env:PROTECTED_ENVIRONMENT/deployment-branch-policies?per_page=100" |
            Out-File -Encoding utf8 "$env:PROTECTED_ENVIRONMENT-branch-policies.json"
          python scripts/release/validate_github_environment_policy.py `
            "$env:PROTECTED_ENVIRONMENT.json" "$env:PROTECTED_ENVIRONMENT-branch-policies.json" `
            --environment $env:PROTECTED_ENVIRONMENT --required-pattern 'v*'

      - name: Validate immutable source and exact candidate run
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'AlysisAi/AlysisCode') { throw 'Unexpected repository.' }
          if ($env:GITHUB_REF -ne "refs/tags/$env:RELEASE_TAG") { throw 'Workflow must run from the exact release tag.' }
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Workflow ref must be a tag.' }
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'candidate_run_id must be positive.' }
          $head = (git rev-parse HEAD).Trim()
          $tagHead = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($head -ne $env:GITHUB_SHA -or $tagHead -ne $env:GITHUB_SHA) { throw 'Tag/source identity mismatch.' }
          $version = python -c "import tomllib; from pathlib import Path; print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match project version.' }
          gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | Out-File -Encoding utf8 candidate-run.json
          @'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("candidate-run.json").read_text(encoding="utf-8-sig"))
          expected = {
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "run_attempt": 1,
              "path": ".github/workflows/managed-cli-vsix-release.yml",
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": os.environ["RELEASE_TAG"],
          }
          for field, value in expected.items():
              if payload.get(field) != value:
                  raise SystemExit(f"candidate run {field} mismatch")
          repository = payload.get("repository", {}).get("full_name")
          head_repository = payload.get("head_repository", {}).get("full_name")
          if repository != os.environ["GITHUB_REPOSITORY"] or head_repository != repository:
              raise SystemExit("candidate run repository identity mismatch")
          '@ | python -

      - name: Download exact linux-x64 candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: vscode-alysis-linux-x64
          path: candidate

      - name: Verify candidate provenance and exact SBOM before any install or execution
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = 'candidate/vscode-alysis-linux-x64.vsix'
          $sbom = 'candidate/vscode-alysis-linux-x64.cdx.json'
          $provenanceReceipt = Join-Path $env:RUNNER_TEMP 'candidate-provenance-receipt.json'
          $sbomReceipt = Join-Path $env:RUNNER_TEMP 'candidate-sbom-receipt.json'
          gh attestation verify $candidate `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" `
            --source-ref "refs/tags/$env:RELEASE_TAG" `
            --source-digest $env:GITHUB_SHA `
            --deny-self-hosted-runners `
            --predicate-type 'https://slsa.dev/provenance/v1' `
            --format json | Out-File -Encoding utf8 $provenanceReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Candidate provenance verification failed.' }
          python scripts/release/validate_github_attestation_receipt.py `
            $provenanceReceipt $candidate `
            --predicate-type 'https://slsa.dev/provenance/v1'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate provenance receipt is invalid.' }
          gh attestation verify $candidate `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" `
            --source-ref "refs/tags/$env:RELEASE_TAG" `
            --source-digest $env:GITHUB_SHA `
            --deny-self-hosted-runners `
            --predicate-type 'https://cyclonedx.org/bom' `
            --format json | Out-File -Encoding utf8 $sbomReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Candidate SBOM attestation verification failed.' }
          python scripts/release/validate_github_attestation_receipt.py `
            $sbomReceipt $candidate `
            --predicate-type 'https://cyclonedx.org/bom' `
            --expected-predicate $sbom
          if ($LASTEXITCODE -ne 0) { throw 'Candidate SBOM receipt is invalid.' }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-alysis/package-lock.json

      - name: Fail closed unless the dedicated real-remote runner is fully pinned
        shell: pwsh
        env:
          EXPECTED_RUNNER_ROLE: ${{ matrix.runner_role }}
          REMOTE_ENVIRONMENT: ${{ matrix.environment }}
          REMOTE_EXTENSION_VERSION: ${{ matrix.remote_extension_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($command in @('git', 'gh', 'npm')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "Missing runner prerequisite: $command" }
          }
          if ($env:REMOTE_ENVIRONMENT -eq 'wsl' -and -not (Get-Command wsl.exe -ErrorAction SilentlyContinue)) {
            throw 'The dedicated WSL runner does not provide wsl.exe.'
          }
          if ($env:REMOTE_ENVIRONMENT -eq 'remote_ssh' -and -not (Get-Command ssh -ErrorAction SilentlyContinue)) {
            throw 'The dedicated Remote-SSH runner does not provide OpenSSH.'
          }
          if ($env:RUNNER_ROLE -ne $env:EXPECTED_RUNNER_ROLE) { throw 'Protected runner role mismatch.' }
          $preflight = python scripts/qa/validate_vscode_remote_acceptance.py preflight `
            --environment $env:REMOTE_ENVIRONMENT `
            --runner-role $env:RUNNER_ROLE `
            --vscode-executable $env:VSCODE_EXECUTABLE `
            --vscode-sha256 $env:VSCODE_EXECUTABLE_SHA256 `
            --vscode-version $env:EXPECTED_VSCODE_VERSION `
            --remote-extension-vsix $env:REMOTE_EXTENSION_VSIX `
            --remote-extension-sha256 $env:REMOTE_EXTENSION_SHA256 `
            --remote-extension-version $env:REMOTE_EXTENSION_VERSION `
            --interactive-session $env:SESSIONNAME
          if ($LASTEXITCODE -ne 0) { throw 'Remote runner preflight failed.' }
          $identity = $preflight | ConvertFrom-Json
          "VSCODE_COMMIT=$($identity.vscode_commit)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile target and isolated remote acceptance driver
        shell: pwsh
        working-directory: extensions/vscode-alysis
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          npm run compile
          python ..\..\scripts\qa\run_vscode_remote_acceptance.py stage-driver `
            out\test\integration\remoteAcceptance\driver\extension.js `
            "$env:RUNNER_TEMP\remote-acceptance-driver"
          $vsce = (Resolve-Path node_modules\.bin\vsce.cmd).Path
          Push-Location "$env:RUNNER_TEMP\remote-acceptance-driver"
          try {
            & $vsce package --no-dependencies `
              --out "$env:RUNNER_TEMP\alysis-remote-acceptance-driver.vsix"
          } finally {
            Pop-Location
          }

      - name: Run real remote installed-VSIX acceptance
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REMOTE_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/qa/run_vscode_remote_acceptance.py run `
            candidate `
            "$env:RUNNER_TEMP\alysis-remote-acceptance-driver.vsix" `
            "vscode-remote-acceptance-$env:REMOTE_ENVIRONMENT.json" `
            --environment $env:REMOTE_ENVIRONMENT `
            --runner-role $env:RUNNER_ROLE `
            --release-tag $env:RELEASE_TAG `
            --source-sha $env:GITHUB_SHA `
            --candidate-run-id $env:CANDIDATE_RUN_ID `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --vscode-executable $env:VSCODE_EXECUTABLE `
            --vscode-sha256 $env:VSCODE_EXECUTABLE_SHA256 `
            --vscode-version $env:EXPECTED_VSCODE_VERSION `
            --vscode-commit $env:VSCODE_COMMIT `
            --remote-extension-vsix $env:REMOTE_EXTENSION_VSIX `
            --remote-extension-sha256 $env:REMOTE_EXTENSION_SHA256 `
            --remote-authority $env:REMOTE_AUTHORITY `
            --remote-connection $env:REMOTE_CONNECTION `
            --workspace-root $env:REMOTE_WORKSPACE_ROOT `
            --local-temp-root $env:RUNNER_TEMP

      - name: Retain raw attempt-bound remote acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-remote-acceptance-raw-${{ matrix.environment }}-${{ github.sha }}-${{ inputs.candidate_run_id }}-attempt-${{ github.run_attempt }}
          path: vscode-remote-acceptance-${{ matrix.environment }}.json
          if-no-files-found: error
          retention-days: 90

  attest-remote-evidence:
    name: Validate and attest selected remote evidence on a hosted runner
    needs: remote-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download exact linux-x64 candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: vscode-alysis-linux-x64
          path: candidate

      - name: Download all successful raw remote attempts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: vscode-remote-acceptance-raw-*-${{ github.sha }}-${{ inputs.candidate_run_id }}-attempt-*
          path: raw-remote-acceptance

      - name: Verify exact candidate before validating remote reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          candidate=candidate/vscode-alysis-linux-x64.vsix
          sbom=candidate/vscode-alysis-linux-x64.cdx.json
          provenance_receipt="$(mktemp)"
          sbom_receipt="$(mktemp)"
          trap 'rm -f "$provenance_receipt" "$sbom_receipt"' EXIT
          gh attestation verify "$candidate" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$provenance_receipt"
          python scripts/release/validate_github_attestation_receipt.py \
            "$provenance_receipt" "$candidate" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "$candidate" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom \
            --format json > "$sbom_receipt"
          python scripts/release/validate_github_attestation_receipt.py \
            "$sbom_receipt" "$candidate" \
            --predicate-type https://cyclonedx.org/bom \
            --expected-predicate "$sbom"

      - name: Select latest valid report independently for each environment
        id: select
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          selection="$(python scripts/qa/validate_vscode_remote_acceptance.py select-latest \
            raw-remote-acceptance candidate attested-remote-acceptance \
            --release-tag "$RELEASE_TAG" \
            --source-sha "$GITHUB_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --maximum-workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --vscode-version 1.90.0)"
          wsl_attempt="$(jq -er '.wsl' <<< "$selection")"
          remote_ssh_attempt="$(jq -er '.remote_ssh' <<< "$selection")"
          [[ "$wsl_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$remote_ssh_attempt" =~ ^[1-9][0-9]*$ ]]
          echo "wsl_attempt=$wsl_attempt" >> "$GITHUB_OUTPUT"
          echo "remote_ssh_attempt=$remote_ssh_attempt" >> "$GITHUB_OUTPUT"

      - name: Attest hosted-validated remote acceptance evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: attested-remote-acceptance/*.json

      - name: Retain explicit per-environment attempt bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode-remote-acceptance-attested-${{ github.sha }}-${{ inputs.candidate_run_id }}-${{ github.run_id }}-wsl-${{ steps.select.outputs.wsl_attempt }}-remote-ssh-${{ steps.select.outputs.remote_ssh_attempt }}
          path: attested-remote-acceptance/*.json
          if-no-files-found: error
          retention-days: 90
