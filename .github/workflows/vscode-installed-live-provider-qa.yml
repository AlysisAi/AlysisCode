name: vscode-installed-live-provider-qa

# Deliberately manual: every matrix job crosses a protected environment before receiving the real
# provider credential. This workflow validates candidate bytes; it never publishes or promotes.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Extension release channel; beta publishes a Marketplace pre-release.
        type: choice
        options: [stable, beta]
        default: beta
        required: true
      release_tag:
        description: "Existing immutable release tag; dispatch from refs/tags/vX.Y.Z."
        required: true
      candidate_run_id:
        description: "Successful managed-cli-vsix-release workflow run for the same tag/SHA."
        required: true

env:
  RELEASE_CHANNEL: ${{ inputs.channel }}

permissions:
  contents: read

concurrency:
  group: vscode-installed-live-provider-${{ inputs.release_tag }}-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  validate-release-source:
    name: Validate source, candidate, and protected environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release and candidate identity
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_REPOSITORY: AlysisAi/AlysisCode
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$REPOSITORY_PRIVATE" = "false"
          test "$REPOSITORY_VISIBILITY" = "public"
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$version"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" \
            > candidate-run.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$GITHUB_SHA" \
            '.event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and .run_attempt == 1 and .path == ".github/workflows/managed-cli-vsix-release.yml" and .head_sha == $source_sha and .head_branch == $release_tag and .repository.full_name == $repository and .head_repository.full_name == $repository' \
            candidate-run.json > /dev/null
      - name: Require protected exact-tag provider environment
        shell: bash
        env:
          GH_API_VERSION: "2026-03-10"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment=vscode-installed-live-provider-qa
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: $GH_API_VERSION" \
            "/repos/${GITHUB_REPOSITORY}/environments/${environment}" \
            > environment.json
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: $GH_API_VERSION" \
            "/repos/${GITHUB_REPOSITORY}/environments/${environment}/deployment-branch-policies?per_page=100" \
            > branch-policies.json
          python scripts/release/validate_github_environment_policy.py \
            environment.json branch-policies.json \
            --environment "$environment" \
            --required-pattern 'v*'

  installed-live-provider:
    name: Installed real-provider QA (${{ matrix.target }})
    needs: validate-release-source
    environment: vscode-installed-live-provider-qa
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-alysis/package-lock.json
      - name: Revalidate live-provider policy after approval
        shell: bash
        env:
          GH_API_VERSION: "2026-03-10"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment=vscode-installed-live-provider-qa
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: $GH_API_VERSION" \
            "repos/${GITHUB_REPOSITORY}/environments/${environment}" > "${environment}.json"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: $GH_API_VERSION" \
            "repos/${GITHUB_REPOSITORY}/environments/${environment}/deployment-branch-policies?per_page=100" \
            > "${environment}-branch-policies.json"
          python scripts/release/validate_github_environment_policy.py \
            "${environment}.json" "${environment}-branch-policies.json" \
            --environment "$environment" --required-pattern 'v*'
      - name: Verify exact tag, source SHA, and successful candidate run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "AlysisAi/AlysisCode"
          test "$GITHUB_REF" = "refs/tags/$REQUESTED_TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-list -n 1 "$REQUESTED_TAG")" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          python - <<'PY'
          import json
          import os

          run = json.load(open("candidate-run.json", encoding="utf-8"))
          expected = {
              "id": int(os.environ["CANDIDATE_RUN_ID"]),
              "event": "workflow_dispatch",
              "head_sha": os.environ["GITHUB_SHA"],
              "head_branch": os.environ["REQUESTED_TAG"],
              "status": "completed",
              "conclusion": "success",
              "run_attempt": 1,
              "path": ".github/workflows/managed-cli-vsix-release.yml",
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(f"Candidate run {field} does not match the immutable dispatch")
          if run.get("repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Candidate run came from a different repository")
          if run.get("head_repository", {}).get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Candidate source came from a different repository")
          PY
      - name: Download exact target candidate from the bound run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir candidate
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "vscode-alysis-$TARGET" \
            --dir candidate
          test "$(find candidate -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 3
          test -s "candidate/vscode-alysis-$TARGET.vsix"
          test -s "candidate/vscode-alysis-$TARGET.cdx.json"
          test -s "candidate/production-dogfood-$TARGET.json"
      - name: Install pinned patched native validation Python
        id: runtime-python
        shell: bash
        run: |
          python scripts/release/install_managed_cli_python.py \
            --target "${{ matrix.target }}" --destination "$RUNNER_TEMP/alysis-python" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build pinned native OpenSSL for Windows ARM64 validators
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        run: ./scripts/release/build_windows_arm64_openssl.ps1
      - name: Install frozen Windows ARM64 validators
        if: matrix.target == 'win32-arm64'
        shell: pwsh
        env:
          UV_PYTHON: ${{ steps.runtime-python.outputs.executable }}
          OPENSSL_DIR: ${{ runner.temp }}/alysis-openssl-arm64
          OPENSSL_STATIC: "1"
        run: uv sync --frozen --no-editable
      - name: Build pinned static OpenSSL for Intel macOS validators
        if: matrix.target == 'darwin-x64'
        shell: bash
        run: bash scripts/release/build_macos_x64_openssl.sh
      - name: Install frozen Intel macOS validators
        if: matrix.target == 'darwin-x64'
        env:
          UV_PYTHON: ${{ steps.runtime-python.outputs.executable }}
          OPENSSL_DIR: ${{ runner.temp }}/alysis-openssl-x64
          OPENSSL_STATIC: "1"
        run: uv sync --frozen --no-editable
      - name: Install frozen validators
        if: matrix.target != 'win32-arm64' && matrix.target != 'darwin-x64'
        env:
          UV_PYTHON: ${{ steps.runtime-python.outputs.executable }}
        run: uv sync --frozen --no-editable
      - name: Compile the source-matched QA driver
        shell: bash
        run: |
          npm --prefix extensions/vscode-alysis ci
          npm --prefix extensions/vscode-alysis run compile
      - name: Verify candidate attestations, SBOM, dogfood binding, and release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          vsix="candidate/vscode-alysis-$TARGET.vsix"
          sbom="candidate/vscode-alysis-$TARGET.cdx.json"
          provenance_receipt="$(mktemp)"
          sbom_receipt="$(mktemp)"
          gh attestation verify "$vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" \
            --source-ref "refs/tags/$REQUESTED_TAG" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$provenance_receipt"
          uv run --frozen --no-sync python scripts/release/validate_github_attestation_receipt.py \
            "$provenance_receipt" "$vsix" \
            --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "$vsix" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/managed-cli-vsix-release.yml" \
            --source-ref "refs/tags/$REQUESTED_TAG" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners \
            --predicate-type https://cyclonedx.org/bom \
            --format json > "$sbom_receipt"
          uv run --frozen --no-sync python scripts/release/validate_github_attestation_receipt.py \
            "$sbom_receipt" "$vsix" \
            --predicate-type https://cyclonedx.org/bom \
            --expected-predicate "$sbom"
          TARGET="$TARGET" uv run --frozen --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.qa.vscode_extension_dogfood import (
              validate_production_dogfood_candidate_binding,
          )

          target = os.environ["TARGET"]
          vsix = Path("candidate") / f"vscode-alysis-{target}.vsix"
          dogfood = Path("candidate") / f"production-dogfood-{target}.json"
          payload = json.loads(dogfood.read_text(encoding="utf-8"))
          validate_production_dogfood_candidate_binding(
              payload,
              vsix,
              require_vscode_compatibility=True,
              channel=os.environ["RELEASE_CHANNEL"],
          )
          digest = hashlib.sha256(dogfood.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"ALYSIS_PRODUCTION_DOGFOOD_SHA256={digest}\n")
          PY
          rm -f "$provenance_receipt" "$sbom_receipt"
      - name: Authorize credential destination from source-controlled policy
        shell: bash
        env:
          LIVE_QA_PROVIDER: ${{ vars.ALYSIS_LIVE_QA_PROVIDER }}
          LIVE_QA_APPROVED_ORIGIN: ${{ vars.ALYSIS_LIVE_QA_APPROVED_ORIGIN }}
        run: |
          set -euo pipefail
          policy="$GITHUB_WORKSPACE/.github/release-policy/vscode-live-provider-origins.json"
          receipt="$(mktemp)"
          trap 'rm -f "$receipt"' EXIT
          uv run --frozen --no-sync python scripts/qa/validate_vscode_live_provider_policy.py \
            "$policy" \
            --provider "$LIVE_QA_PROVIDER" \
            --origin "$LIVE_QA_APPROVED_ORIGIN" \
            > "$receipt"
          policy_sha256="$(jq -er '.policy_sha256 | select(test("^[0-9a-f]{64}$"))' "$receipt")"
          printf 'ALYSIS_LIVE_QA_ORIGIN_POLICY_SHA256=%s\n' "$policy_sha256" \
            >> "$GITHUB_ENV"
      - name: Run installed production VSIX against the protected real provider (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ALYSIS_LIVE_API_KEY: ${{ secrets.ALYSIS_LIVE_API_KEY }}
          ALYSIS_LIVE_QA_PROVIDER: ${{ vars.ALYSIS_LIVE_QA_PROVIDER }}
          ALYSIS_LIVE_QA_MODEL: ${{ vars.ALYSIS_LIVE_QA_MODEL }}
          ALYSIS_LIVE_QA_BASE_URL: ${{ vars.ALYSIS_LIVE_QA_BASE_URL }}
          ALYSIS_LIVE_QA_APPROVED_ORIGIN: ${{ vars.ALYSIS_LIVE_QA_APPROVED_ORIGIN }}
          ALYSIS_PRODUCTION_VSIX_PATH: ${{ github.workspace }}/candidate/vscode-alysis-${{ matrix.target }}.vsix
          ALYSIS_EXPECTED_PLATFORM_TARGET: ${{ matrix.target }}
          ALYSIS_INSTALLED_LIVE_QA_OUTPUT: ${{ github.workspace }}/vscode-alysis-${{ matrix.target }}.installed-live-provider.json
          ALYSIS_RELEASE_TAG: ${{ inputs.release_tag }}
          ALYSIS_SOURCE_SHA: ${{ github.sha }}
          ALYSIS_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ALYSIS_WORKFLOW_RUN_ID: ${{ github.run_id }}
          ALYSIS_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALYSIS_NATIVE_SIGNATURE_CHECK: passed
          ALYSIS_RELEASE_SIGNATURE_CHECK: passed
        run: xvfb-run -a node extensions/vscode-alysis/out/test/integration/production-live-provider/runTest.js
      - name: Run installed production VSIX against the protected real provider (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          ALYSIS_LIVE_API_KEY: ${{ secrets.ALYSIS_LIVE_API_KEY }}
          ALYSIS_LIVE_QA_PROVIDER: ${{ vars.ALYSIS_LIVE_QA_PROVIDER }}
          ALYSIS_LIVE_QA_MODEL: ${{ vars.ALYSIS_LIVE_QA_MODEL }}
          ALYSIS_LIVE_QA_BASE_URL: ${{ vars.ALYSIS_LIVE_QA_BASE_URL }}
          ALYSIS_LIVE_QA_APPROVED_ORIGIN: ${{ vars.ALYSIS_LIVE_QA_APPROVED_ORIGIN }}
          ALYSIS_PRODUCTION_VSIX_PATH: ${{ github.workspace }}/candidate/vscode-alysis-${{ matrix.target }}.vsix
          ALYSIS_EXPECTED_PLATFORM_TARGET: ${{ matrix.target }}
          ALYSIS_INSTALLED_LIVE_QA_OUTPUT: ${{ github.workspace }}/vscode-alysis-${{ matrix.target }}.installed-live-provider.json
          ALYSIS_RELEASE_TAG: ${{ inputs.release_tag }}
          ALYSIS_SOURCE_SHA: ${{ github.sha }}
          ALYSIS_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ALYSIS_WORKFLOW_RUN_ID: ${{ github.run_id }}
          ALYSIS_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          ALYSIS_NATIVE_SIGNATURE_CHECK: passed
          ALYSIS_RELEASE_SIGNATURE_CHECK: passed
        run: node extensions/vscode-alysis/out/test/integration/production-live-provider/runTest.js
      - name: Validate redacted evidence against exact candidate bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          uv run --frozen --no-sync python scripts/qa/validate_vscode_installed_live_provider.py --channel "$RELEASE_CHANNEL" \
            "vscode-alysis-$TARGET.installed-live-provider.json" \
            "candidate/vscode-alysis-$TARGET.vsix" \
            "candidate/production-dogfood-$TARGET.json" \
            --target "$TARGET" \
            --release-tag "$REQUESTED_TAG" \
            --source-sha "$GITHUB_SHA" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --provider-origin-policy \
              "$GITHUB_WORKSPACE/.github/release-policy/vscode-live-provider-origins.json"
      - name: Attest redacted installed live-provider evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: vscode-alysis-${{ matrix.target }}.installed-live-provider.json
      - name: Upload redacted installed live-provider evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-alysis-${{ matrix.target }}-installed-live-provider-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: vscode-alysis-${{ matrix.target }}.installed-live-provider.json
          if-no-files-found: error
          retention-days: 30
