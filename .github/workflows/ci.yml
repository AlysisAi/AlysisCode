name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go for the pinned workflow linter
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.4"
          cache: false

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: test (ubuntu-latest, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {"python-version":"3.11"}
          - {"python-version":"3.12"}
          - {"python-version":"3.13"}
          # Fresh WSL installs Ubuntu 26.04, whose system Python is 3.14.
          - {"python-version":"3.14"}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Sync locked test dependencies
        run: uv sync --frozen --python "${{ matrix.python-version }}" --extra dev --extra documents

      - name: Check public repository contents
        run: uv run --frozen --no-sync python scripts/qa/check_public_repo.py

      - name: Lint
        run: uv run --frozen --no-sync ruff check .

      - name: Format check
        run: uv run --frozen --no-sync ruff format --check .

      - name: Test
        run: uv run --frozen --no-sync pytest -q

  reliability-qualification:
    name: production reliability (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Newer macOS runner images currently cannot expose Python loopback listeners.
        # https://github.com/actions/runner-images/issues/14409
        os: [ubuntu-latest, windows-latest, macos-14]
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"
      - name: Sync locked qualification dependencies
        run: uv sync --frozen --python "3.12" --extra dev --extra documents
      - name: Test hosted onboarding and installer failure handling
        run: uv run --frozen --no-sync pytest -q tests/test_alysis_cloud.py tests/test_windows_installer.py
      - name: Beta and Alpha account, credit and model contracts
        run: >-
          uv run --frozen --no-sync pytest -q
          tests/test_paid_plan_status.py tests/test_paid_plan_presentation.py
          tests/test_account_login.py tests/test_account_status.py
          tests/test_hosted_account_error_display.py tests/test_reasoning_contracts.py
          tests/test_model_reasoning_catalog.py
          tests/test_hosted_model_transport.py tests/test_hosted_availability.py

      - name: Qualify source and installed wheel
        run: >-
          uv run --frozen --no-sync python scripts/qa/qualify_production_reliability.py
          --require-clean --output-dir "${{ runner.temp }}/production-reliability"
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-reliability-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/production-reliability/manifest.json
            ${{ runner.temp }}/production-reliability/*.log
            ${{ runner.temp }}/production-reliability/*.xml
            ${{ runner.temp }}/production-reliability/dist/*.whl
          if-no-files-found: error

  macos-smoke:
    name: macOS smoke
    runs-on: macos-14
    timeout-minutes: 20
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Sync locked smoke dependencies
        run: uv sync --frozen --python "3.12" --extra dev --extra documents

      - name: Smoke test CLI
        run: |
          uv run --frozen --no-sync alysis --help
          uv run --frozen --no-sync alysis --version

      - name: Smoke test macOS network lifecycle
        run: |
          uv run --frozen --no-sync pytest -q tests/test_durable_service_ownership.py::test_macos_process_listener_inspection_without_global_privileges
          uv run --frozen --no-sync pytest -q tests/test_http_cancellation.py tests/test_deadline_fault_injection.py

  install-script:
    name: install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh scripts/install.sh

      # Installs the latest PyPI release the way a new user does: empty home,
      # no uv on PATH, so the script bootstraps uv and a private Python.
      - name: Install into a clean home, then re-run to upgrade
        shell: bash
        run: |
          set -euo pipefail
          install_home="$(mktemp -d)"
          env -i HOME="$install_home" SHELL=/bin/bash PATH=/usr/bin:/bin sh scripts/install.sh
          "$install_home/.local/bin/alysis" --version
          env -i HOME="$install_home" SHELL=/bin/bash PATH="$install_home/.local/bin:/usr/bin:/bin" sh scripts/install.sh
          "$install_home/.local/bin/alysis" --help > /dev/null

  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
          - macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode-alysis/package-lock.json

      - name: Install uv for packaged extension dogfood
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Sync locked bridge dependencies
        run: uv sync --frozen --extra dev --extra documents

      - name: Install extension dependencies
        working-directory: extensions/vscode-alysis
        run: npm ci

      - name: Compile, lint, and run extension unit tests
        working-directory: extensions/vscode-alysis
        run: npm run compile && npm run lint && npm test

      - name: Test real Extension Host on Linux
        if: runner.os == 'Linux'
        working-directory: extensions/vscode-alysis
        run: xvfb-run -a npm run test:integration

      - name: Test real Extension Host on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: extensions/vscode-alysis
        run: npm run test:integration

      - name: Test current Stable Extension Host on Linux
        if: runner.os == 'Linux'
        working-directory: extensions/vscode-alysis
        env:
          VSCODE_TEST_VERSION: stable
        run: xvfb-run -a npm run test:integration

      - name: Test current Stable Extension Host on Windows and macOS
        if: runner.os != 'Linux'
        working-directory: extensions/vscode-alysis
        env:
          VSCODE_TEST_VERSION: stable
        run: npm run test:integration

      - name: Package the pre-release VSIX on every supported desktop OS
        working-directory: extensions/vscode-alysis
        run: npm run package:dev-vsix -- --pre-release

      - name: Dogfood unpacked VSIX on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --frozen python scripts/qa/vscode_extension_dogfood.py --mode mock --package-mode require --extension-host run

      - name: Dogfood unpacked VSIX on Windows and macOS
        if: runner.os != 'Linux'
        run: uv run --frozen python scripts/qa/vscode_extension_dogfood.py --mode mock --package-mode require --extension-host run

      - name: Audit production extension dependencies
        if: runner.os == 'Linux'
        working-directory: extensions/vscode-alysis
        run: npm audit --audit-level=high

  uv-project-workflow:
    name: uv project workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Verify built-in AgentBox integration and project resolution
        run: uv run --frozen --extra dev --extra documents python -m pytest tests/test_agentbox_integration.py -q

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - workflow-lint
      - test
      - reliability-qualification
      - macos-smoke
      - uv-project-workflow
      - vscode-extension

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.23"

      - name: Install frozen build dependencies
        run: uv sync --frozen --no-editable --extra dev --extra documents

      - name: Build deterministic distributions from the frozen environment
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --clear --no-create-gitignore --no-build-isolation --no-sources --out-dir dist/python

      - name: Validate archive identity, inventory, and clean installation
        run: >-
          uv run --frozen --no-sync python
          scripts/release/validate_python_distributions.py dist/python

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/python/*
          if-no-files-found: error
