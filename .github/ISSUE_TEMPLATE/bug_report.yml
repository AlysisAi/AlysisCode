name: Bug report
description: Help us reproduce and fix a problem with the Alysis Code CLI.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing issues](https://github.com/AlysisAi/AlysisCode/issues) and try the latest version with `alysis update` before reporting a bug.

        For vulnerabilities, use the [private security report](https://github.com/AlysisAi/AlysisCode/security/advisories/new).
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem and include the error message, if there is one.
      placeholder: When I run a task, the session exits after the provider returns an empty response.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the commands or actions needed to reproduce the problem.
      placeholder: |
        1. Configure the provider and model.
        2. Run the command or chat action.
        3. Describe when the problem appears.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: Describe what should have happened instead.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Your environment
  - type: input
    id: version
    attributes:
      label: Alysis Code version
      description: Run `alysis --version`, or provide the commit if you installed from source.
      placeholder: e.g. 0.15.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Install script (install.sh / install.ps1)
        - pipx
        - uv tool
        - pip / virtualenv
        - From source
        - Other / not sure
  - type: dropdown
    id: access
    attributes:
      label: Model access
      options:
        - Alysis account (alysis login)
        - Own API key
        - AI subscription (e.g. ChatGPT Codex sign-in)
        - Local endpoint (Ollama, LM Studio, vLLM)
        - Other / not sure
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: e.g. OpenRouter / deepseek-chat
  - type: dropdown
    id: mode
    attributes:
      label: Permission mode
      options:
        - readonly
        - review
        - auto
        - fullaccess
        - Not sure
  - type: input
    id: python
    attributes:
      label: Python version
      description: Optional. Leave this blank if the installer manages Python for you.
      placeholder: e.g. 3.12
  - type: markdown
    attributes:
      value: |
        ### Additional context
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or other details
      description: Remove credentials and personal data. Review any support bundle before attaching it.
      placeholder: Add anything else that would help us investigate.
