name: Feature request
description: Suggest an improvement to the Alysis Code CLI.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search existing requests](https://github.com/AlysisAi/AlysisCode/issues?q=is%3Aissue%20label%3Aenhancement) first. If someone has suggested the same idea, add your use case to that issue.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Describe the problem, who it affects, and what you are trying to achieve.
      placeholder: When I work on ..., I need ... because ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal UI / chat
        - One-shot runs (alysis run)
        - Forge / subagents
        - Providers and models
        - Sandbox and permissions
        - MCP, skills, plugins, hooks, custom tools
        - VS Code / JetBrains integration
        - Install and updates
        - Docs
        - Other / not sure
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Your ideas
        These details are optional. Describing the problem is enough to start the conversation.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have an approach in mind, describe how it would work.
      placeholder: Ideally, I would be able to ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      placeholder: Have you tried another way to solve this?
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Examples, screenshots, or links that help explain the idea.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be interested in contributing a pull request.
