[build-system]
requires = ["editables==0.5", "hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "alysis-code"
version = "0.16.0"
description = "Open-source AI coding agent for your terminal. Bring any model, sandboxed by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
  "agent",
  "ai",
  "ai-agent",
  "ai-coding-agent",
  "cli",
  "coding-agent",
  "developer-tools",
  "llm",
  "local-llm",
  "mcp",
  "ollama",
  "sandbox",
  "terminal",
  "tui",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities",
]
dependencies = [
  # HTTP clients can automatically decode untrusted Brotli response bodies.
  "brotli>=1.2.1; platform_python_implementation == 'CPython'",
  "brotlicffi>=1.2.1.0; platform_python_implementation != 'CPython'",
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
  "click>=8.0.0",
  "cryptography>=50.0.0",
  "ddgs>=9.0.0",
  "dulwich==1.2.19; sys_platform == 'win32'",
  "httpcore>=1.0.0,<2.0.0",
  "httpx>=0.27.0",
  "keyring>=25.0.0",
  "markdown-it-py>=4.2.0,<5.0.0",
  "packaging>=23.0",
  "pillow>=13.0.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.0",
  "prompt-toolkit>=3.0.43",
  "psutil>=7.2.2,<8.0",
  "pygments>=2.17.0,<3.0.0",
  "rich>=13.7.1",
  "tiktoken>=0.7.0",
  "typer>=0.12.0",
  "websockets>=15.0,<17.0",
]

[project.urls]
Homepage = "https://alysiscode.com/"
Documentation = "https://alysiscode.com/docs"
Changelog = "https://github.com/AlysisAi/AlysisCode/blob/main/docs/CHANGELOG.md"
Funding = "https://github.com/sponsors/AlysisAi"
Issues = "https://github.com/AlysisAi/AlysisCode/issues"
Security = "https://github.com/AlysisAi/AlysisCode/blob/main/.github/SECURITY.md"
Source = "https://github.com/AlysisAi/AlysisCode"

[project.optional-dependencies]
documents = [
  "reportlab==4.4.9",
  "pypdfium2==5.13.0",
  "markdown-it-py==4.2.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "XlsxWriter==3.2.9",
  "python-pptx==1.0.2",
  "lxml==6.1.3",
]
dev = [
  "jsonschema>=4.23.0",
  "dulwich==1.2.19",
  "editables==0.5",
  "hatchling==1.31.0",
  "pyyaml>=6.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
managed-build = [
  "setuptools>=84.1.0",
  "pyinstaller==6.21.0",
  "pyinstaller-hooks-contrib==2026.6",
]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
# Canonical command.
alysis-code = "alysis_code.cli:app"
# Short alias.
alysis = "alysis_code.cli:app"
alysis-ide-bridge = "alysis_code.ide.stdio_bridge:run_stdio_bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/alysis_code"]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/docs/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/pyproject.toml",
  "/hatch_build.py",
  "/src/alysis_code",
]
exclude = [
  "**/__pycache__/**",
  "**/*.py[cod]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=sys"
pythonpath = ["src", "."]
markers = [
    "smoke: portable mock-provider end-to-end build smoke across execution modes (pytest -m smoke)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP017", "UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
