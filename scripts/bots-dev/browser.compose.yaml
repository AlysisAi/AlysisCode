# Opt-in local browser or offline desktop profile. Never a production tenant boundary.
# Same nested namespaces as the existing Linux lab; Chromium's own sandbox stays on.
services:
  bots:
    security_opt: !override
      - no-new-privileges:true
      - seccomp=${ALYSIS_BOTS_SECCOMP:-../cloud-dev/seccomp.json}
      - systempaths=unconfined
    cpus: 2
    mem_limit: 1g
    pids_limit: 512
    tmpfs: !override ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
